name: Agda CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Agda
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.6.4.1'

      - name: Checkout Cubical Library
        uses: actions/checkout@v3
        with:
          repository: agda/cubical
          ref: v0.6
          path: cubical-lib

      - name: Register Cubical Library
        run: |
          mkdir -p ~/.agda
          echo "$GITHUB_WORKSPACE/cubical-lib/cubical.agda-lib" >> ~/.agda/libraries
          echo "cubical" >> ~/.agda/defaults

      - name: Check Hodge Conjecture Proof
        run: |
          agda src/Everything.agda
